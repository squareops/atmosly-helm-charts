annotations:
  category: Database
  images: |
    - name: kubectl
      image: docker.io/bitnamilegacy/kubectl:1.29.1-debian-11-r3
    - name: mongodb-exporter
      image: docker.io/bitnamilegacy/mongodb-exporter:0.40.0-debian-11-r6
    - name: mongodb
      image: docker.io/bitnamilegacy/mongodb:7.0.5-debian-11-r6
    - name: nginx
      image: docker.io/bitnamilegacy/nginx:1.25.3-debian-11-r7
    - name: os-shell
      image: docker.io/bitnamilegacy/os-shell:11-debian-11-r96
  licenses: Apache-2.0
apiVersion: v2
appVersion: 7.0.5
dependencies:
- name: common
  repository: oci://registry-1.docker.io/bitnamicharts
  tags:
  - bitnami-common
  version: 2.x.x
description: MongoDB(R) is a relational open source NoSQL database. Easy to use, it
  stores data in JSON-like documents. Automated scalability and high-performance.
  Ideal for developing cloud native applications.
home: https://bitnami.com
icon: https://bitnami.com/assets/stacks/mongodb/img/mongodb-stack-220x234.png
keywords:
- mongodb
- database
- nosql
- cluster
- replicaset
- replication
maintainers:
- name: VMware, Inc.
  url: https://github.com/bitnami/charts
name: mongodb
sources:
- https://atmosly-builder.github.io/atmosly-mongo-helm-chart/mongodb-14.10.0.tgz
version: 14.10.9
